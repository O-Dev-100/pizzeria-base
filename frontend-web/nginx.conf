# ==============================================================================
# NGINX REVERSE PROXY - PIZZERÍA BELLA NAPOLI (CON CLOUDFLARE ZERO TRUST)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Directorio de los archivos estáticos HTML/CSS/JS del Frontend Web
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para alto rendimiento en despliegue
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cabeceras de Seguridad Web (Security Headers)
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # 1. Servir archivos estáticos del Frontend Web y KDS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy hacia la API REST del backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy hacia la App Móvil PWA de Clientes
    location /app/ {
        proxy_pass http://frontend-qr-app:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Redirección si acceden a DbGate sin la barra final
    location = /dbgate {
        return 301 /dbgate/;
    }

    # 5. Reverse Proxy hacia DbGate (con soporte WebSockets y SSE en subdirectorio /dbgate)
    location /dbgate/ {
        proxy_pass http://dbgate:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Manejo de páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


